- name: Configure web server
  hosts: web
  become: yes
  vars:
    package_name: nginx

  tasks:
    - name: Install nginx
      apt:
        name: "{{ package_name }}"
        state: present
        update_cache: yes

    - name: Ensure nginx is running
      service:
        name: "{{ package_name }}"
        state: started
        enabled: true
